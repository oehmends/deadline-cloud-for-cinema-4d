name: "\U0001F41B Bug Report"
description: Report a bug
title: "Bug: (short bug description)"
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report!

        ⚠️ If the bug that you are reporting is a security-related issue or security vulnerability,
        then please do not create a report via this template. Instead please
        notify AWS/Amazon Security via our [vulnerability reporting page](http://aws.amazon.com/security/vulnerability-reporting/)
        or directly via email to [AWS Security](aws-security@amazon.com).

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What is the problem? A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected_behaviour
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: current_behaviour
    attributes:
      label: Current Behaviour
      description: What actually happened? Please include as much detail as you can.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction Steps
      description: |
        Please provide as much detail as you can to help us understand how we can reproduce the bug.
        Step by step instructions and self-contained code snippets are ideal.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide information on the environment and software versions that you are using to reproduce the bug.
      value: |
        At minimum:
        1. Operating system (e.g. Windows Server 2022; Amazon Linux 2023; etc.)
        2. Version of Cinema 4D
        3. Copy the entire contents of the About panel (Extensions > AWS Deadline Cloud Submitter > About)
        4. Renderer used (e.g. Standard, Redshift, Arnold, etc.)
        5. Fleet configuration (Worker OS, GPU type if using Redshift)

        Please share other details about your environment that you think might be relevant to reproducing the bug.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Please attach relevant log files. To gather logs:
        1. Enable "Activate detailed logging" in the submitter's Job-Specific Settings
        2. Submit your job
        3. After the job completes (or fails), open Deadline Cloud Monitor
        4. Navigate to your job
        5. Click "Download logs" and select "Entire session" to download the full session logs
      placeholder: Paste log excerpts here or attach log files to this issue.
    validations:
      required: false
